name: Build RunImage

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-runimage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment (swap + userns)
        run: |
          sudo fallocate -l 10G /mnt/swapfile-extra
          sudo chmod 600 /mnt/swapfile-extra
          sudo mkswap /mnt/swapfile-extra
          sudo swapon /mnt/swapfile-extra
          sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns <<<0

      - name: Build
        run: |
          chmod a+x build-runimage.sh
          ./build-runimage.sh

      - name: Commit Package Versions (Keepalive)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s package_versions.txt ]; then
            git add package_versions.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: auto-update package versions list (keepalive)"
              git push
            else
              echo "No changes in package_versions.txt. Skipping commit."
            fi
          else
            echo "package_versions.txt not found or empty. Skipping commit."
          fi

      - name: Upload and release RunImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous --cleanup-tag -y 2>/dev/null || true
          gh release create continuous \
            --title "Continuous Build" \
            --notes "Automated nightly build of RunImage Mega Environment." \
            ./runimage package_versions.txt
